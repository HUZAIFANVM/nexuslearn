version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: lms-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: lms-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-nexuslearn}
    depends_on:
      - mongodb
    # [FAISS-DISABLED] volumes:
    # [FAISS-DISABLED]   - faiss_data:/app/faiss_indexes

  frontend:
    build:
      context: ./frontend-react
      args:
        VITE_API_URL: http://localhost:8000
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: lms-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
  # [FAISS-DISABLED] faiss_data:
